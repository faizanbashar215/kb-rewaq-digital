<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KB Rewaq Digital — Poster Generator</title>
<style>
  :root{--bg:#0b0f14;--card:#141c26;--card2:#1a2430;--accent:#1ec8a0;--accent-d:#0e9e7e;--accent2:#ffd166;--text:#eaf2f8;--muted:#94a3b8;--line:#243240}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',system-ui,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);padding:22px;line-height:1.6}
  body.ar{direction:rtl;font-family:'Segoe UI',Tahoma,'Noto Sans Arabic',Arial,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:360px 1fr;gap:26px}
  .top{display:flex;justify-content:space-between;align-items:center;grid-column:1/-1;margin-bottom:6px}
  body.ar .top{flex-direction:row-reverse}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .brand .m{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-d));display:flex;align-items:center;justify-content:center}
  .brand b{color:var(--accent)}
  .toggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
  .toggle button{background:transparent;border:none;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}
  .toggle button.on{background:var(--accent);color:#06231c}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 5px}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#0b0f14;color:var(--text);font-size:14px;font-family:inherit}
  .colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .sw{width:32px;height:32px;border-radius:8px;cursor:pointer;border:2px solid transparent}
  .sw.on{border-color:#fff}
  button.gen{width:100%;margin-top:20px;background:var(--accent);color:#06231c;border:none;padding:14px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer}
  button.gen:hover{background:var(--accent2)}
  .stage{display:flex;align-items:center;justify-content:center;background:radial-gradient(500px 300px at 50% 0,rgba(30,200,160,.08),transparent),#070a0e;border-radius:16px;min-height:460px;padding:24px}
  #poster{width:360px;aspect-ratio:1/1;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between;padding:30px;box-shadow:0 14px 44px rgba(0,0,0,.55);position:relative;overflow:hidden}
  #poster .brand{font-size:13px;font-weight:700;letter-spacing:1.2px;opacity:.9}
  #poster .badge{position:absolute;top:24px;right:24px;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;backdrop-filter:blur(4px)}
  body.ar #poster .badge{right:auto;left:24px}
  #poster .head{font-size:33px;font-weight:800;line-height:1.12;margin-top:6px}
  #poster .headAr{font-size:27px;font-weight:800;line-height:1.3;margin-top:4px;opacity:.96}
  #poster .sub{font-size:16px;margin-top:12px;opacity:.92;line-height:1.5}
  #poster .deal{font-size:23px;font-weight:800;margin-top:auto;padding:12px 16px;background:rgba(0,0,0,.28);border-radius:12px;display:inline-block}
  #poster .foot{font-size:12px;margin-top:14px;opacity:.85}
  .hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
  .acts{display:flex;gap:10px;margin-top:14px}
  .acts button{flex:1;background:var(--card2);color:var(--text);border:1px solid var(--line);padding:11px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px}
  .acts button:hover{border-color:var(--accent)}
  .copied{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#06231c;padding:12px 22px;border-radius:10px;font-weight:800;opacity:0;transition:.3s;pointer-events:none;z-index:99}
  .copied.show{opacity:1}
  [data-ar]{display:none}
  body.ar [data-en]{display:none}
  body.ar [data-ar]{display:inline}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}.stage{min-height:360px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="m">🎨</div><div>KB Rewaq <b>Digital</b></div></div>
    <div class="toggle" id="tg"><button data-l="en" onclick="setLang('en')">EN</button><button data-l="ar" onclick="setLang('ar')">العربية</button></div>
  </div>

  <div class="panel">
    <label data-en>Business Name</label><label data-ar>اسم النشاط</label>
    <input id="biz" value="KB Rewaq Digital">
    <label data-en>Headline (English)</label><label data-ar>العنوان (إنجليزي)</label>
    <input id="head" value="GRAND OPENING">
    <label data-en>Headline (Arabic)</label><label data-ar>العنوان (عربي)</label>
    <input id="headAr" value="افتتاح كبير" dir="rtl">
    <label data-en>Sub text</label><label data-ar>نص فرعي</label>
    <textarea id="sub" rows="2">Best food in Kuwait · Free delivery</textarea>
    <label data-en>Deal / Offer</label><label data-ar>العرض</label>
    <input id="deal" value="50% OFF — This Week Only">
    <label data-en>Footer (contact)</label><label data-ar>التذييل (تواصل)</label>
    <input id="foot" value="WhatsApp: +965 50703252">
    <label data-en>Theme</label><label data-ar>اللون</label>
    <div class="colors" id="pal"></div>
    <button class="gen" onclick="draw()"><span data-en>Generate Poster</span><span data-ar>إنشاء البوستر</span></button>
    <div class="acts">
      <button onclick="window.print()"><span data-en>⬇ Save PDF</span><span data-ar>⬇ حفظ PDF</span></button>
      <button onclick="copyPng()"><span data-en>📋 Copy PNG</span><span data-ar>📋 نسخ صورة</span></button>
    </div>
    <p class="hint" data-en>For client work, put their name in Business field and screenshot the result. No internet needed.</p>
    <p class="hint" data-ar>لأعمال العملاء، ضع اسمهم في حقل النشاط والتقط صورة للنتيجة. بلا إنترنت.</p>
  </div>

  <div class="stage">
    <div id="poster">
      <div>
        <div class="badge"><span data-en>NEW</span><span data-ar>جديد</span></div>
        <div class="brand" id="o_brand"></div>
        <div class="head" id="o_head"></div>
        <div class="headAr" id="o_headAr" dir="rtl"></div>
        <div class="sub" id="o_sub"></div>
      </div>
      <div>
        <div class="deal" id="o_deal"></div>
        <div class="foot" id="o_foot"></div>
      </div>
    </div>
  </div>
  <div class="copied" id="copied"><span data-en>Copied! Paste in WhatsApp</span><span data-ar>تم النسخ! الصق في واتساب</span></div>
</div>

<script src="html2canvas.min.js"></script>
<script>
const themes={
  solid:'#1ec8a0',grad:'linear-gradient(135deg,#1ec8a0,#0e9e7e)',dark:'linear-gradient(160deg,#1a1a2e,#16213e)',
  orange:'linear-gradient(135deg,#ff6b35,#ee0979)',gold:'linear-gradient(135deg,#f7971e,#ffd200)',
  blue:'linear-gradient(135deg,#2193b0,#6dd5ed)',red:'linear-gradient(135deg,#cb2d3e,#ef473a)'
};
const pal=document.getElementById('pal');let cur='solid';
Object.keys(themes).forEach(k=>{
  const d=document.createElement('div');d.className='sw'+(k==='solid'?' on':'');
  d.style.background=themes[k];d.title=k;
  d.onclick=()=>{cur=k;[...pal.children].forEach(c=>c.classList.remove('on'));d.classList.add('on');draw();};
  pal.appendChild(d);
});
function draw(){
  const p=document.getElementById('poster');
  p.style.background=themes[cur];
  const dark=(cur==='dark');
  p.style.color=(cur==='orange'||cur==='gold')?'#1a1a1a':(dark?'#fff':'#06231c');
  document.getElementById('o_brand').textContent=document.getElementById('biz').value;
  document.getElementById('o_head').textContent=document.getElementById('head').value;
  document.getElementById('o_headAr').textContent=document.getElementById('headAr').value;
  document.getElementById('o_sub').textContent=document.getElementById('sub').value;
  document.getElementById('o_deal').textContent=document.getElementById('deal').value;
  document.getElementById('o_foot').textContent=document.getElementById('foot').value;
}
function copyPng(){
  const el=document.getElementById('poster');
  if(typeof html2canvas==='undefined'){alert('html2canvas.min.js not found in same folder. Keep it next to this file.');return;}
  html2canvas(el,{backgroundColor:null,scale:2,useCORS:true}).then(canvas=>{
    canvas.toBlob(blob=>{
      if(navigator.clipboard && navigator.clipboard.write){
        navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(()=>{
          const c=document.getElementById('copied');c.classList.add('show');setTimeout(()=>c.classList.remove('show'),1800);
        }).catch(()=>downloadPng(canvas));
      } else { downloadPng(canvas); }
    },'image/png');
  });
}
function downloadPng(canvas){
  const a=document.createElement('a');a.download='kb_rewaq_poster.png';a.href=canvas.toDataURL('image/png');a.click();
}
// language
function setLang(l){
  document.body.classList.toggle('ar',l==='ar');
  document.documentElement.lang=l;document.documentElement.dir=(l==='ar')?'rtl':'ltr';
  localStorage.setItem('kb_lang',l);
  document.querySelectorAll('#tg button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
}
(function(){const s=localStorage.getItem('kb_lang');const nav=(navigator.language||'en').toLowerCase();setLang(s||(nav.startsWith('ar')?'ar':'en'));})();
draw();
</script>
</body>
</html>
